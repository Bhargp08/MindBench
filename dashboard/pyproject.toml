[project]
name = "mindbench-dashboard"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "mindbench-analysis",
    "mindbench-etl",
    "streamlit==1.67.0",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindbench_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mindbench-etl = { path = "../etl", editable = true }
mindbench-analysis = { path = "../analysis/python", editable = true }
