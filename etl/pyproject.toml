[project]
name = "mindbench-etl"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "google-auth==2.62.2",
    "jsonschema==4.26.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindbench_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
