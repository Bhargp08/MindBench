name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: experiment } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: experiment/package-lock.json }
      - run: npm ci
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [etl, analysis/python]
    defaults: { run: { working-directory: "${{ matrix.project }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest

  r:
    # R tests are marked pending (skip) until Bharg confirms the R toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - run: Rscript -e 'install.packages("testthat")'
      - run: Rscript -e 'testthat::test_dir("analysis/r/tests/testthat", stop_on_failure = TRUE)'
