[project]
name = "mindbench-analysis"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "arviz==1.3.0",
    "llvmlite<0.46",
    "matplotlib==3.11.2",
    "numba<0.63",
    "numpy>=2.0,<2.4",
    "pymc==6.4.0",
    "scipy>=1.18",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
