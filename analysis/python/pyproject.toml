[project]
name = "mindbench-analysis"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "scipy==1.17.1",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
