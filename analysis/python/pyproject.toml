[project]
name = "mindbench-analysis"
version = "0.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib==3.11.2",
    "numpy>=2.0,<2.4",
    "scipy>=1.18",
]

[dependency-groups]
dev = ["pytest==8.3.4"]
# Bayesian models (MB-20). Kept out of the main dependencies so the dashboard does not install PyMC.
# numba/llvmlite are held back because newer llvmlite has no Intel-Mac wheel (numba 0.62 supports numpy up to 2.3).
bayes = [
    "pymc==6.4.0",
    "arviz==1.3.0",
    "numba<0.63",
    "llvmlite<0.46",
    "pyddm==0.9.0",
]

[tool.uv]
default-groups = ["dev", "bayes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
